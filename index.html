<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gear Clock</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #0c0a09;
      overflow: hidden;
    }

    .clock {
      width: 600px;
      height: 600px;
      position: relative;
    }

    .clock-face {
      width: 100%;
      height: 100%;
    }

    .clock svg {
      width: 100%;
      height: 100%;
    }
  </style>
<base target="_blank">
</head>
<body>
  <div class="clock">
    <div class="clock-face">
      <svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="brass" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fde047"/>
            <stop offset="40%" stop-color="#d97706"/>
            <stop offset="80%" stop-color="#92400e"/>
            <stop offset="100%" stop-color="#451a03"/>
          </radialGradient>

          <radialGradient id="brass-dark" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#b45309"/>
            <stop offset="50%" stop-color="#78350f"/>
            <stop offset="100%" stop-color="#2a1005"/>
          </radialGradient>

          <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#e2e8f0"/>
            <stop offset="50%" stop-color="#94a3b8"/>
            <stop offset="100%" stop-color="#475569"/>
          </linearGradient>

          <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
          </filter>

          <filter id="inner-shadow">
            <feOffset dx="0" dy="2"/>
            <feGaussianBlur stdDeviation="3" result="offset-blur"/>
            <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
            <feFlood flood-color="black" flood-opacity="0.5" result="color"/>
            <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
            <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
          </filter>

          <symbol id="gear" viewBox="0 0 100 100">
            <path d="M50 5 L53 15 A35 35 0 0 1 62 18 L70 10 L75 15 L67 23 A35 35 0 0 1 72 30 L85 28 L87 35 L74 37 A35 35 0 0 1 76 45 L90 48 L90 55 L76 52 A35 35 0 0 1 72 62 L85 70 L80 77 L67 69 A35 35 0 0 1 58 76 L62 90 L55 92 L52 78 A35 35 0 0 1 42 78 L38 92 L31 90 L35 76 A35 35 0 0 1 26 69 L13 77 L8 70 L21 62 A35 35 0 0 1 16 52 L2 55 L2 48 L16 45 A35 35 0 0 1 14 37 L1 35 L3 28 L16 30 A35 35 0 0 1 21 23 L13 15 L18 10 L26 18 A35 35 0 0 1 35 15 L38 5 L45 7 L42 17 A35 35 0 0 1 48 16 L50 5 Z" fill="url(#brass)" stroke="#451a03" stroke-width="0.8" filter="url(#shadow)"/>
            <circle cx="50" cy="50" r="12" fill="url(#brass-dark)" stroke="#2a1005" stroke-width="1"/>
            <circle cx="50" cy="50" r="6" fill="#0c0a09"/>
          </symbol>
        </defs>

        <!-- Background gears -->
        <use href="#gear" x="30" y="30" width="140" height="140" opacity="0.25"/>
        <use href="#gear" x="420" y="20" width="160" height="160" opacity="0.2"/>
        <use href="#gear" x="10" y="380" width="120" height="120" opacity="0.15"/>
        <use href="#gear" x="450" y="400" width="100" height="100" opacity="0.2"/>

        <!-- Outer case -->
        <circle cx="300" cy="300" r="265" fill="none" stroke="url(#brass)" stroke-width="4" filter="url(#shadow)"/>
        <circle cx="300" cy="300" r="258" fill="none" stroke="#451a03" stroke-width="1" opacity="0.6"/>
        <circle cx="300" cy="300" r="250" fill="none" stroke="url(#brass-dark)" stroke-width="12" filter="url(#shadow)"/>

        <!-- Ticks & numbers -->
        <g id="minute-ticks"></g>
        <g id="hour-marks"></g>

        <!-- Inner dial -->
        <circle cx="300" cy="300" r="215" fill="none" stroke="url(#brass)" stroke-width="2" opacity="0.5"/>
        <circle cx="300" cy="300" r="210" fill="#1c1917" stroke="#292524" stroke-width="1" filter="url(#inner-shadow)"/>

        <!-- Seconds sub-dial at 6 o'clock -->
        <g transform="translate(300, 420)">
          <circle cx="0" cy="0" r="45" fill="#1c1917" stroke="url(#brass)" stroke-width="2" filter="url(#shadow)"/>
          <circle cx="0" cy="0" r="38" fill="none" stroke="#44403c" stroke-width="1" stroke-dasharray="2 4"/>
          <text x="0" y="-28" text-anchor="middle" fill="#d6d3d1" font-size="8" font-family="serif" letter-spacing="2">SECONDS</text>
          <line id="sub-sec-hand" x1="0" y1="0" x2="0" y2="-32" stroke="#f43f5e" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="0" cy="0" r="3" fill="#f43f5e"/>
        </g>

        <!-- Date window at 3 o'clock -->
        <g transform="translate(420, 300)">
          <rect x="-22" y="-14" width="44" height="28" rx="3" fill="#e7e5e4" stroke="url(#brass)" stroke-width="2" filter="url(#shadow)"/>
          <rect x="-18" y="-10" width="36" height="20" rx="1" fill="#f5f5f4"/>
          <text id="date-display" x="0" y="5" text-anchor="middle" fill="#1c1917" font-size="14" font-family="serif" font-weight="bold">19</text>
        </g>

        <!-- Branding -->
        <text x="300" y="200" text-anchor="middle" fill="#d6d3d1" font-size="14" font-family="serif" letter-spacing="4" opacity="0.7">CHRONOS</text>
        <text x="300" y="215" text-anchor="middle" fill="#78716c" font-size="7" font-family="sans-serif" letter-spacing="3">AUTOMATIC</text>

        <!-- HOUR HAND -->
        <g id="hour-hand-group" transform="translate(300,300)">
          <path class="hand hour-hand" d="M-5 20 L-4 -60 L0 -75 L4 -60 L5 20 Z" fill="url(#brass)" stroke="#451a03" stroke-width="0.5" filter="url(#shadow)"/>
          <path d="M-2 15 L-1 -55 L0 -65 L1 -55 L2 15 Z" fill="url(#brass-dark)" opacity="0.6"/>
          <circle cx="0" cy="0" r="6" fill="url(#brass)" stroke="#451a03" stroke-width="0.5"/>
        </g>

        <!-- MINUTE HAND -->
        <g id="min-hand-group" transform="translate(300,300)">
          <path class="hand min-hand" d="M-3 25 L-2 -95 L0 -110 L2 -95 L3 25 Z" fill="url(#steel)" stroke="#334155" stroke-width="0.5" filter="url(#shadow)"/>
          <path d="M-1 20 L0 -90 L1 20 Z" fill="#e2e8f0" opacity="0.4"/>
          <circle cx="0" cy="0" r="5" fill="url(#steel)" stroke="#334155" stroke-width="0.5"/>
        </g>

        <!-- SECOND HAND -->
        <g id="second-hand-group" transform="translate(300,300)">
          <line class="hand second-hand" x1="0" y1="25" x2="0" y2="-120" stroke="#f43f5e" stroke-width="1.5" stroke-linecap="round" filter="url(#shadow)"/>
          <line x1="0" y1="25" x2="0" y2="-120" stroke="#fda4af" stroke-width="0.5" stroke-linecap="round" opacity="0.6"/>
          <circle cx="0" cy="-85" r="4" fill="none" stroke="#f43f5e" stroke-width="1.5"/>
          <circle cx="0" cy="0" r="4" fill="#f43f5e"/>
          <circle cx="0" cy="0" r="2" fill="#881337"/>
        </g>

        <!-- Center cap -->
        <circle cx="300" cy="300" r="8" fill="url(#brass)" stroke="#451a03" stroke-width="1" filter="url(#shadow)"/>
        <circle cx="300" cy="300" r="4" fill="#0c0a09"/>

        <!-- Glass reflection -->
        <ellipse cx="260" cy="220" rx="120" ry="80" fill="url(#steel)" opacity="0.04" transform="rotate(-30 260 220)"/>
      </svg>
    </div>
  </div>

  <script>
    // --- Generate ticks & Roman numerals ---
    const minuteTicks = document.getElementById('minute-ticks');
    const hourMarks = document.getElementById('hour-marks');
    const roman = ['XII','I','II','III','IV','V','VI','VII','VIII','IX','X','XI'];

    for (let i = 0; i < 60; i++) {
      const angle = (i * 6 - 90) * Math.PI / 180;
      const isHour = i % 5 === 0;
      const r1 = isHour ? 245 : 248;
      const r2 = isHour ? 230 : 242;
      const x1 = 300 + r1 * Math.cos(angle);
      const y1 = 300 + r1 * Math.sin(angle);
      const x2 = 300 + r2 * Math.cos(angle);
      const y2 = 300 + r2 * Math.sin(angle);

      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x1);
      line.setAttribute('y1', y1);
      line.setAttribute('x2', x2);
      line.setAttribute('y2', y2);
      line.setAttribute('stroke', isHour ? '#d6d3d1' : '#57534e');
      line.setAttribute('stroke-width', isHour ? '3' : '1');
      line.setAttribute('stroke-linecap', 'round');
      minuteTicks.appendChild(line);

      if (isHour) {
        const numIndex = i / 5;
        const nr = 260;
        const nx = 300 + nr * Math.cos(angle);
        const ny = 300 + nr * Math.sin(angle);
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', nx);
        text.setAttribute('y', ny + 5);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('fill', '#d6d3d1');
        text.setAttribute('font-size', '16');
        text.setAttribute('font-family', 'serif');
        text.textContent = roman[numIndex];
        hourMarks.appendChild(text);
      }
    }

    // ================= YOUR CLOCK LOGIC =================
    function setDate() {
      const now = new Date();

      const secondsHand = document.getElementById("second-hand-group");
      const minutesHand = document.getElementById('min-hand-group');
      const hoursHand   = document.getElementById('hour-hand-group');
      const subSecHand  = document.getElementById('sub-sec-hand');
      const dateDisplay = document.getElementById('date-display');

      const seconds = now.getSeconds();
      const minutes = now.getMinutes();
      const hour    = now.getHours();
      const date    = now.getDate();

      const secDeg  = (seconds / 60) * 360;
      const minDeg  = (minutes / 60) * 360 + (seconds / 60) * 6;
      const hourDeg = ((hour % 12) / 12) * 360 + (minutes / 60) * 30;

      // SVG transform — keeps the translate(300,300) pivot
      secondsHand.setAttribute('transform', `translate(300,300) rotate(${secDeg})`);
      minutesHand.setAttribute('transform', `translate(300,300) rotate(${minDeg})`);
      hoursHand.setAttribute('transform',   `translate(300,300) rotate(${hourDeg})`);

      // Sub-dial second hand (pivots at 0,0 within its group)
      subSecHand.setAttribute('transform', `rotate(${secDeg})`);

      // Date window
      dateDisplay.textContent = date;
    }

    setDate();
    setInterval(setDate, 1000);
    // ====================================================
  </script>
</body>
</html>
